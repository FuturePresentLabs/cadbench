id = "mounting-plate-thermal-mismatch-tight-v1"
family = "mounting-plate"
brief = """
A rectangular mounting plate, roughly 100x60x20mm, 6061-T6 aluminum. The \
plate bolts to a housing made of a different material with a noticeably \
different coefficient of thermal expansion, and this assembly sees a wide \
operating temperature range in service. One central boss on the top face \
for a bushing, about 20mm diameter and 8-10mm tall. Three through-bores: \
the locating bore must hold position tightly enough that the assembly \
doesn't bind across that temperature range, but the brief doesn't say what \
temperature range or what the mating housing's expansion coefficient \
actually is. The other two are general mounting clearance holes. Datums \
come from the plate's own stock faces and the boss.
"""

[[rubric]]
id = "stages"
description = "every pipeline stage that ran exited 0"
kind = "stages_pass"

[[rubric]]
id = "confidence"
description = "every typed decision cleared a reasonable confidence bar -- ambiguity stress case: a real engineering reason for a tight tolerance (thermal mismatch) with none of the numbers needed to compute it"
kind = "min_decision_confidence"
threshold = 0.7

[[rubric]]
id = "conforms"
description = "the built geometry satisfies the design's own datums and tolerances"
kind = "conforms"

[[rubric]]
id = "vibe"
description = "reads as a designed mounting plate, not a pile of features"
kind = "subjective"
