id = "mounting-plate-unambiguous-v1"
family = "mounting-plate"
brief = """
A rectangular mounting plate, 100x60x20mm, 6061-T6 aluminum, general-purpose \
bracket use with no precision-stack requirement. One central boss on the \
top face, 20mm diameter, 10mm tall, for a bushing with generous clearance. \
Three through-bores, all general mounting clearance holes on a standard \
+/-0.25mm positional tolerance from the plate's own stock edges — none of \
them locates anything else, so there is no tighter reference to hold. This \
is the loosest reasonable interpretation of a mounting plate: every \
dimension, tolerance, and datum choice should have one obvious answer.
"""

[[rubric]]
id = "stages"
description = "every pipeline stage that ran exited 0"
kind = "stages_pass"

[[rubric]]
id = "confidence"
description = "every typed decision cleared a reasonable confidence bar -- a golden-path positive control: if this ever fails, the harness or the backend regressed, not the brief"
kind = "min_decision_confidence"
threshold = 0.7

[[rubric]]
id = "conforms"
description = "the built geometry satisfies the design's own datums and tolerances"
kind = "conforms"

[[rubric]]
id = "vibe"
description = "reads as a designed mounting plate, not a pile of features"
kind = "subjective"
