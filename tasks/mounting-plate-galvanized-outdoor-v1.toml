id = "mounting-plate-galvanized-outdoor-v1"
family = "mounting-plate"
brief = """
A rectangular mounting plate, roughly 110x65x20mm, hot-dip galvanized mild \
steel -- an outdoor railing-mount bracket where the galvanizing, not the \
base material, carries the corrosion resistance. One central boss on the \
top face for a bushing, about 20mm diameter and 10mm tall. Three \
through-bores, all general mounting clearance holes on a standard \
+/-0.25mm positional tolerance from the plate's own stock edges -- none of \
them locates anything else. Every dimension and tolerance choice here \
should have one obvious answer.
"""

