id = "mounting-plate-iso-fit-unspecified-v1"
family = "mounting-plate"
brief = """
A rectangular mounting plate, roughly 100x60x20mm, 6061-T6 aluminum. One \
central boss on the top face for a bushing, about 20mm diameter and \
8-10mm tall. Three through-bores: the locating bore takes a standard \
dowel pin and needs a repeatable locating fit that stays serviceable -- \
removable for maintenance, but not so loose it lets the part walk under \
vibration. The other two are general mounting clearance holes. Datums \
come from the plate's own stock faces and the boss.
"""

[[rubric]]
id = "stages"
description = "every pipeline stage that ran exited 0"
kind = "stages_pass"

[[rubric]]
id = "confidence"
description = "every typed decision cleared a reasonable confidence bar -- an ambiguity stress case phrased in real ISO 286 fit-class terms rather than vague prose: 'removable but won't walk under vibration' sits between a clearance fit (H7/g6, easy to remove, can work loose) and a light interference fit (H7/n6, won't walk, harder to service) with no stated preference between them"
kind = "min_decision_confidence"
threshold = 0.7

[[rubric]]
id = "conforms"
description = "the built geometry satisfies the design's own datums and tolerances"
kind = "conforms"

[[rubric]]
id = "vibe"
description = "reads as a designed mounting plate, not a pile of features"
kind = "subjective"
