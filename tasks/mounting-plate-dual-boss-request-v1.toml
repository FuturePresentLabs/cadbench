id = "mounting-plate-dual-boss-request-v1"
family = "mounting-plate"
brief = """
A rectangular mounting plate, roughly 120x70x20mm, 6061-T6 aluminum, with \
TWO bosses on the top face -- one at each end of the plate, each about \
18mm diameter and 8mm tall, for a pair of bushings that must stay parallel \
to each other. Three through-bores for general mounting, standard \
+/-0.2mm positional tolerance, datums from the plate's own stock faces.
"""

[[rubric]]
id = "stages"
description = "every pipeline stage that ran exited 0 -- capability-edge case: the curated mounting-plate template is documented as one centre boss, three bores, so a two-boss request is expected to surface as a failed or capability-missing stage rather than a silent single-boss substitution"
kind = "stages_pass"

[[rubric]]
id = "confidence"
description = "every typed decision cleared a reasonable confidence bar, for whatever subset of the brief the backend actually attempts"
kind = "min_decision_confidence"
threshold = 0.7

[[rubric]]
id = "conforms"
description = "the built geometry satisfies the design's own datums and tolerances, if a build ran at all"
kind = "conforms"

[[rubric]]
id = "vibe"
description = "not automated -- a human should look at whether the backend refused honestly or quietly produced a one-boss part instead"
kind = "subjective"
