id = "mounting-plate-cast-iron-machine-base-v1"
family = "mounting-plate"
brief = """
A rectangular mounting plate, roughly 150x100x25mm, gray cast iron — \
chosen for its vibration-damping mass on a benchtop machine tool base, not \
for machinability. One central boss on the top face for a spindle bearing \
housing, about 30mm diameter and 12mm tall. Three through-bores: the \
locating bore must hold the spindle housing's dowel to within 0.05mm \
position, which is the manufacturer's stated alignment spec for that \
housing; the other two are general mounting clearance holes. Datums come \
from the plate's own stock faces and the boss.
"""

[[rubric]]
id = "stages"
description = "every pipeline stage that ran exited 0"
kind = "stages_pass"

[[rubric]]
id = "confidence"
description = "every typed decision cleared a reasonable confidence bar -- the tolerance is tight but its source (the housing's own spec) is stated, so this should still score confidently"
kind = "min_decision_confidence"
threshold = 0.7

[[rubric]]
id = "conforms"
description = "the built geometry satisfies the design's own datums and tolerances"
kind = "conforms"

[[rubric]]
id = "vibe"
description = "reads as a designed machine base plate, not a pile of features"
kind = "subjective"
