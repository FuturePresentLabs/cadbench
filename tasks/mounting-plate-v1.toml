id = "mounting-plate-v1"
family = "mounting-plate"
brief = """
A rectangular mounting plate, roughly 100x60x20mm, 6061-T6 aluminum. One \
central boss on the top face for a bearing or bushing, about 20mm diameter \
and 8-10mm tall. Three through-bores: one locates the part (position \
toleranced to the plate's datum scheme) and should hold a dowel or locating \
pin; the other two are general mounting clearance holes. Datums should come \
from the plate's own stock faces and the boss, not be invented separately.
"""

[[rubric]]
id = "stages"
description = "every pipeline stage that ran exited 0"
kind = "stages_pass"

[[rubric]]
id = "confidence"
description = "every typed decision cleared a reasonable confidence bar"
kind = "min_decision_confidence"
threshold = 0.7

[[rubric]]
id = "conforms"
description = "the built geometry satisfies the design's own datums and tolerances"
kind = "conforms"

[[rubric]]
id = "vibe"
description = "reads as a designed mounting plate, not a pile of features (mirrors pcbbench's 'curated, not generated' criterion)"
kind = "subjective"
